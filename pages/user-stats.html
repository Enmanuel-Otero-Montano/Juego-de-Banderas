<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="57x57" href="../assets/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="../assets/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="../assets/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="../assets/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="../assets/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="../assets/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="../assets/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="../assets/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/user-register-dist.css">
    <link rel="stylesheet" href="../moduls/buttons.css">
    <title>Estadísticas</title>
</head>

<body>
    <header class="header">
        <a href="../index.html" class="go-home">Inicio</a>
    </header>
    <main class="main">
        <h1 class="hero" style="margin-top: 20px;">Tus estadísticas</h1>
        <div class="register-container">
            <div id="stats" class="profile-stats-container"
                style="margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; color: white;">
                <h3 style="text-align: center; margin-top: 0;">Rendimiento - Modo Carrera</h3>
                <div id="stats-container" class="stats-grid"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 15px;">

                    <!-- Card A: Highest Stage -->
                    <div class="stat-card"
                        style="text-align: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                        <span class="stat-label"
                            style="font-size: 0.8rem; opacity: 0.8; display: block; margin-bottom: 5px;">Etapa
                            Máxima</span>
                        <span class="stat-value" id="stat-highest-stage"
                            style="display: block; font-size: 1.2rem; font-weight: bold; color: #4CAF50;">-</span>
                    </div>

                    <!-- Card B: Max Score -->
                    <div class="stat-card"
                        style="text-align: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                        <span class="stat-label"
                            style="font-size: 0.8rem; opacity: 0.8; display: block; margin-bottom: 5px;">Mejor
                            Rating</span>
                        <span class="stat-value" id="stat-max-score"
                            style="display: block; font-size: 1.2rem; font-weight: bold; color: yellow;">-</span>
                    </div>

                    <!-- Card C: Last Played -->
                    <div class="stat-card"
                        style="text-align: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                        <span class="stat-label"
                            style="font-size: 0.8rem; opacity: 0.8; display: block; margin-bottom: 5px;">Última
                            Partida</span>
                        <span class="stat-value" id="stat-last-played"
                            style="display: block; font-size: 0.9rem; font-weight: normal;">-</span>
                    </div>

                    <!-- Card D: Leaderboard Rank -->
                    <div class="stat-card"
                        style="text-align: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                        <span class="stat-label"
                            style="font-size: 0.8rem; opacity: 0.8; display: block; margin-bottom: 5px;">Ranking
                            Global</span>
                        <span class="stat-value" id="stat-leaderboard-rank"
                            style="display: block; font-size: 1.2rem; font-weight: bold;">-</span>
                    </div>

                </div>
                <div style="margin-top: 25px; text-align: center;">
                    <a href="career-mode.html" class="btn-check" id="btn-view-ranking"
                        style="padding: 8px 20px; font-size: 0.9rem;">Ver ranking</a>
                    <p style="font-size: 0.75rem; opacity: 0.6; margin-top: 15px;">Estas estadísticas corresponden
                        exclusivamente al Modo Carrera.</p>
                </div>
            </div>
            <div id="login-message" style="display: none; text-align: center; margin-top: 10px;">
                <p style="color: #ff9800; font-weight: bold;">Inicia sesión para ver tus estadísticas.
                </p>
                <a href="user-login.html" class="btn-check">Iniciar sesión</a>
            </div>

        </div>
    </main>
    <footer class="footer">
        <p class="author">Created by Enmanuel</p>
    </footer>
    <script type="module" src="../javascript/stats.js"></script>
</body>

</html>
