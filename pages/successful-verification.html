<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Correo confirmado · Banderas, países y regiones</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #f5f8f4; color: #173c31; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: #fff; border: 1px solid #d9e4dd; border-radius: 24px; box-shadow: 0 18px 45px #173c3118; max-width: 420px; padding: 36px 28px; text-align: center; }
      .check { align-items: center; background: #dff7e8; border-radius: 50%; color: #087f5b; display: inline-flex; font-size: 30px; height: 58px; justify-content: center; width: 58px; }
      h1 { font-size: 1.7rem; margin: 18px 0 10px; }
      p { color: #537066; line-height: 1.55; margin: 0; }
      a { background: #16815f; border-radius: 14px; color: white; display: inline-block; font-weight: 700; margin-top: 26px; padding: 14px 22px; text-decoration: none; }
      a:hover { background: #0e694c; }
    </style>
  </head>
  <body>
    <main>
      <div class="check" aria-hidden="true">✓</div>
      <h1>Correo confirmado</h1>
      <p>Tu cuenta ya está lista. Vuelve a la aplicación e inicia sesión con tu alias y contraseña.</p>
      <a href="../index.html">Ir al sitio del juego</a>
    </main>
  </body>
</html>
