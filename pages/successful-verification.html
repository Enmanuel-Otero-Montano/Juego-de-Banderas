<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="57x57" href="../assets/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="../assets/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="../assets/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="../assets/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="../assets/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="../assets/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="../assets/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="../assets/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="../assets/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/successful-verification-dist.css">
    <title>Email verified</title>
</head>
<body>
    <main class="verification-page">
        <section class="verification-card" aria-labelledby="verification-title">
            <img class="brand-mark" src="../assets/favicon/android-icon-192x192.png" alt="Flags, Countries and Regions">
            <p class="eyebrow">BANDERAS, PAÍSES Y REGIONES</p>
            <div class="success-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m5 12 4.2 4.2L19 6.5"/></svg>
            </div>
            <h1 id="verification-title">Email verified!</h1>
            <p class="message">Your account is ready to use.</p>
            <div class="next-step">
                <span class="step-number">1</span>
                <p>Close this page and return to the app.</p>
                <span class="step-number">2</span>
                <p>Sign in with the alias and password you chose.</p>
            </div>
            <p class="note">You can safely close this page: verification is complete.</p>
        </section>
    </main>
    <script type="module" src="../javascript/successful-verification.js"></script>
</body>
</html>
